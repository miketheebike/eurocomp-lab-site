<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" aria-label="1,964 eligible firms enter a lottery, splitting them into 986 firms offered a grant of up to EUR 10,000 and 978 firms receiving advisory services only" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="20" y="66" width="150" height="66" rx="6" fill="var(--dg-panel)" stroke="var(--dg-rule)"/>
  <text x="95" y="95" text-anchor="middle" fill="var(--dg-ink)" font-size="19" font-weight="bold">1,964</text>
  <text x="95" y="114" text-anchor="middle" fill="var(--dg-ink-soft)" font-size="10.5">eligible firms</text>

  <path d="M170 99 H230" stroke="var(--dg-line)" stroke-width="1.5"/>

  <rect x="230" y="66" width="150" height="66" rx="6" fill="var(--dg-accent)"/>
  <text x="305" y="92" text-anchor="middle" fill="var(--dg-ink)" font-size="12.5" font-weight="bold">LOTTERY</text>
  <text x="305" y="110" text-anchor="middle" fill="var(--dg-ink)" font-size="10.5">every firm, the same chance</text>

  <path d="M380 99 H410 V40 H440" stroke="var(--dg-line)" stroke-width="1.5" fill="none"/>
  <path d="M380 99 H410 V160 H440" stroke="var(--dg-line)" stroke-width="1.5" fill="none"/>

  <rect x="440" y="14" width="245" height="52" rx="6" fill="var(--dg-accent)"/>
  <text x="454" y="36" fill="var(--dg-ink)" font-size="12.5" font-weight="bold">986 offered a grant</text>
  <text x="454" y="53" fill="var(--dg-ink)" font-size="11">up to EUR 10,000, plus advice</text>

  <rect x="440" y="134" width="245" height="52" rx="6" fill="var(--dg-panel)" stroke="var(--dg-rule)"/>
  <text x="454" y="156" fill="var(--dg-ink)" font-size="12.5" font-weight="bold">978 standard group</text>
  <text x="454" y="173" fill="var(--dg-ink-soft)" font-size="11">advisory services only</text>
</svg>
